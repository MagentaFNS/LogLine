name: Mobile CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'clients/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'clients/mobile/**'

jobs:
  # ============ ЛИНТЕР И ТЕСТЫ ============
  lint-and-test:
    name: Lint & Test React Native
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./clients/mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint script found"

      - name: Type check
        run: npx tsc --noEmit || echo "No TypeScript found"

      - name: Run tests
        run: npm run test -- --watchAll=false || echo "No tests found"

  # ============ СБОРКА ANDROID (только для main) ============
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    defaults:
      run:
        working-directory: ./clients/mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: clients/mobile/android/app/build/outputs/apk/release/app-release.apk

  # ============ СБОРКА iOS (только на macOS) ============
  build-ios:
    name: Build iOS (macOS only)
    runs-on: macos-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    defaults:
      run:
        working-directory: ./clients/mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS
        run: |
          cd ios
          xcodebuild -workspace LogLineMobile.xcworkspace \
            -scheme LogLineMobile \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/LogLineMobile.xcarchive archive