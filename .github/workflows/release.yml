name: Create Release

on:
  push:
    tags:
      - 'v*'  # Запускается при создании тега v1.0.0, v2.1.3 и т.д.

jobs:
  # ============ СОЗДАНИЕ RELEASE ============
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release notes
        id: release_notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "# 🚀 LogLine Pro ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## What's changed" >> $GITHUB_OUTPUT
          echo "- [Full Changelog](https://github.com/${{ github.repository }}/compare/${{ github.event.previous_tag }}...${{ github.ref_name }})" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## 📦 Download" >> $GITHUB_OUTPUT
          echo "- Web App: [vercel.app](https://logline-pro.vercel.app)" >> $GITHUB_OUTPUT
          echo "- Android APK: attached below" >> $GITHUB_OUTPUT
          echo "EOF"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: LogLine Pro ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            clients/mobile/android/app/build/outputs/apk/release/app-release.apk