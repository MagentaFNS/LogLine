<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <mask id="typingMask">
      <rect x="120" y="20" width="0" height="60" fill="white">
        <animate 
          attributeName="width" 
          from="0" 
          to="400" 
          dur="2.5s" 
          fill="freeze"
        />
      </rect>
    </mask>

    <style>
      @keyframes slideUp {
        0% { opacity: 0; transform: translateY(25px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .title {
        font-size: 52px;
        fill: #ffffff;
        font-weight: bold;
        font-family: 'JetBrains Mono', 'Roboto Mono', 'Source Code Pro', monospace;
      }

      .sub {
        animation: slideUp 2s ease-out 0.5s both;
        font-size: 20px;
        fill: #cccccc;
        font-family: 'Fira Code', monospace;
      }

      .cursor {
        animation: blink 0.8s step-end infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="800" height="200" fill="#0a0a0a00" />

  <!-- Печатающийся текст -->
  <text x="400" y="70" text-anchor="middle" class="title" mask="url(#typingMask)">
    LogLine
  </text>

  <!-- Курсор -->
  <rect x="560" y="35" width="3" height="40" fill="#ffffff" class="cursor">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9;1" dur="2.8s" fill="freeze"/>
  </rect>

  <text x="400" y="115" text-anchor="middle" class="sub">
    «Your Developer Tracker.»
  </text>
</svg>